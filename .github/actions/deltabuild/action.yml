name: DeltaBuild
description: Generate a delta traversal project using Meziantou.DeltaBuild

inputs:
  input-project:
    description: Input traversal project path
    required: true
  output-project:
    description: Output delta project path
    required: true
  traversal-after-import:
    description: |
      Project imported after traversal project references in the generated file.
      Empty means DeltaBuild's own default, which is a file that does not exist,
      so the generated project imports nothing.
    required: false
    default: ""
  properties:
    description: |
      Newline-separated MSBuild properties (NAME=VALUE) applied to the evaluation of the
      input project. DeltaBuild has no --property option, so they are passed as environment
      variables, which MSBuild reads as global properties.
    required: false
    default: ""
  full-rebuild-triggers:
    description: |
      Newline-separated list of full rebuild trigger globs or paths.
      Each entry is passed as --full-rebuild-trigger.
    required: false
    default: ""
  base-commit:
    description: Optional base commit SHA to pass as --base-commit
    required: false
    default: ""
  run-generate:
    description: Whether to run DeltaBuild generation
    required: false
    default: "true"
  test-projects-only:
    description: Whether to include only test projects
    required: false
    default: "false"
  shard:
    description: Optional shard number to pass to DeltaBuild
    required: false
    default: ""
  total-shards:
    description: Optional total shard count to pass to DeltaBuild
    required: false
    default: ""
  shard-separate:
    description: |
      Newline-separated list of projects.
      Each entry is passed as --shard-separate.
    required: false
    default: ""
  include:
    description: |
      Newline-separated list of project paths or globs.
      Each entry is passed as --include.
    required: false
    default: ""

outputs:
  project:
    description: Project path to build (delta project if generated; full build project when run-generate is false)
    value: ${{ steps.compute-project.outputs.project }}
  has-project:
    description: Whether there is at least one project to build
    value: ${{ steps.compute-project.outputs.has-project }}

runs:
  using: composite
  steps:
    - name: Install DeltaBuild
      if: ${{ inputs.run-generate == 'true' }}
      shell: pwsh
      run: dotnet tool install --global Meziantou.DeltaBuild

    - name: Generate delta project
      id: generate-delta
      if: ${{ inputs.run-generate == 'true' }}
      shell: pwsh
      env:
        INPUT_PROJECT: ${{ inputs.input-project }}
        OUTPUT_PROJECT: ${{ inputs.output-project }}
        TRAVERSAL_AFTER_IMPORT: ${{ inputs.traversal-after-import }}
        MSBUILD_PROPERTIES: ${{ inputs.properties }}
        FULL_REBUILD_TRIGGERS: ${{ inputs.full-rebuild-triggers }}
        BASE_COMMIT: ${{ inputs.base-commit }}
        TEST_PROJECTS_ONLY: ${{ inputs.test-projects-only }}
        SHARD: ${{ inputs.shard }}
        TOTAL_SHARDS: ${{ inputs.total-shards }}
        SHARD_SEPARATE: ${{ inputs.shard-separate }}
        INCLUDE_PROJECTS: ${{ inputs.include }}
      run: |
        $arguments = @(
          "generate"
          "--input", $env:INPUT_PROJECT
          "--output", $env:OUTPUT_PROJECT
          "--no-output-if-empty"
        )

        if ($env:TRAVERSAL_AFTER_IMPORT) {
          $arguments += @("--traversal-after-import", $env:TRAVERSAL_AFTER_IMPORT)
        }

        # MSBuild reads environment variables as global properties, so this is how the
        # properties reach the evaluation of the input project.
        $env:MSBUILD_PROPERTIES -split "`n" | ForEach-Object {
          $property = $_.Trim()
          if ($property) {
            $name, $value = $property.Split("=", 2)
            if (-not $value) { throw "Invalid property, expected NAME=VALUE: $property" }
            Write-Host "Setting property $name=$value"
            Set-Item -Path "env:$name" -Value $value
          }
        }

        if ($env:TEST_PROJECTS_ONLY -eq "true") {
          $arguments += "--test-projects-only"
        }

        # All-zero SHAs can appear in some push edge cases (for example branch creation),
        # and are not valid git commits for DeltaBuild base selection.
        if ($env:BASE_COMMIT -and $env:BASE_COMMIT -notmatch '^0+$') {
          $arguments += @("--base-commit", $env:BASE_COMMIT)
        }

        if ($env:SHARD) {
          $arguments += @("--shard", $env:SHARD)
        }

        if ($env:TOTAL_SHARDS) {
          $arguments += @("--total-shards", $env:TOTAL_SHARDS)
        }

        $env:SHARD_SEPARATE -split "`n" | ForEach-Object {
          $project = $_.Trim()
          if ($project) {
            $arguments += @("--shard-separate", $project)
          }
        }

        $env:INCLUDE_PROJECTS -split "`n" | ForEach-Object {
          $project = $_.Trim()
          if ($project) {
            $arguments += @("--include", $project)
          }
        }

        $env:FULL_REBUILD_TRIGGERS -split "`n" | ForEach-Object {
          $trigger = $_.Trim()
          if ($trigger) {
            $arguments += @("--full-rebuild-trigger", $trigger)
          }
        }

        & Meziantou.DeltaBuild @arguments

    - name: Compute output project
      id: compute-project
      shell: pwsh
      env:
        INPUT_PROJECT: ${{ inputs.input-project }}
        OUTPUT_PROJECT: ${{ inputs.output-project }}
        RUN_GENERATE: ${{ inputs.run-generate }}
      run: |
        $deltaProjectExists = Test-Path -LiteralPath $env:OUTPUT_PROJECT
        $shouldUseFullBuild = $env:RUN_GENERATE -ne "true"
        $hasProject = $deltaProjectExists -or $shouldUseFullBuild

        if ($deltaProjectExists) {
          Write-Host "Using delta build file:"
          Get-Content $env:OUTPUT_PROJECT
          "project=$($env:OUTPUT_PROJECT)" >> $env:GITHUB_OUTPUT
        } elseif ($shouldUseFullBuild) {
          Write-Host "Using full build file: $($env:INPUT_PROJECT)"
          "project=$($env:INPUT_PROJECT)" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "No projects were affected. Skipping build."
          "project=" >> $env:GITHUB_OUTPUT
        }

        "has-project=$hasProject" >> $env:GITHUB_OUTPUT
