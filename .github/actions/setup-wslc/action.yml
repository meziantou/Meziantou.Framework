name: 'Setup wslc'
description: 'Installs the pre-release WSL, which ships the wslc container CLI, and puts wslc.exe on the PATH'

runs:
  using: "composite"
  steps:
    - name: Install the pre-release WSL
      shell: pwsh
      run: |
        # wslc ships inside WSL itself, and only the pre-release channel carries it (WSL 2.9.3 or higher)
        # The update service intermittently answers with a transient error (e.g. Forbidden (403),
        # Wsl/UpdatePackage/0x80190193). It keeps answering with it for several minutes while the other
        # agents of the same run are served normally, so retry until the time budget below is spent instead
        # of a fixed number of attempts. The delay is capped as it would otherwise keep doubling.
        $timeoutSeconds = 300
        $baseDelaySeconds = 5
        $maxDelaySeconds = 30

        $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
        $attempt = 0

        while ($true) {
          $attempt++
          Write-Host "Updating WSL (attempt $attempt, $([int]$stopwatch.Elapsed.TotalSeconds)s of ${timeoutSeconds}s elapsed)"
          wsl --update --pre-release
          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
            break
          }

          $delaySeconds = [math]::Min([int]($baseDelaySeconds * [math]::Pow(2, $attempt - 1)), $maxDelaySeconds)
          if (($stopwatch.Elapsed.TotalSeconds + $delaySeconds) -ge $timeoutSeconds) {
            throw "wsl --update --pre-release failed with exit code $exitCode after $attempt attempt(s) in $([int]$stopwatch.Elapsed.TotalSeconds) second(s)"
          }

          Write-Host "Retrying WSL update in $delaySeconds second(s)."
          Start-Sleep -Seconds $delaySeconds
        }

        wsl --version

    - name: Locate wslc.exe
      shell: pwsh
      run: |
        # The runner captured its PATH before WSL was updated, so a freshly installed wslc.exe does not
        # resolve yet. Find it and publish its directory to the jobs that come next.
        $candidates = @(
          Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\wslc.exe"
          Join-Path $env:ProgramFiles "WSL\wslc.exe"
          Join-Path $env:SystemRoot "System32\wslc.exe"
        )

        $wslc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
        if (-not $wslc) {
          $wslc = Get-ChildItem -LiteralPath (Join-Path $env:ProgramFiles "WindowsApps") -Filter "wslc.exe" -Recurse -ErrorAction SilentlyContinue
            | Select-Object -First 1 -ExpandProperty FullName
        }

        if (-not $wslc) {
          # Reported as a warning so the missing runtime surfaces where it is meaningful: the Wslc tests
          # themselves, which fail instead of skipping on the CI agents
          Write-Host "::warning::wslc.exe was not found. Searched: $($candidates -join ', ') and $env:ProgramFiles\WindowsApps"
          Get-AppxPackage -Name "*WindowsSubsystemForLinux*" | Format-List -Property Name, Version, InstallLocation | Out-String | Write-Host
          Get-ChildItem -LiteralPath (Join-Path $env:ProgramFiles "WSL") -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name | Out-String | Write-Host
          exit 0
        }

        Write-Host "Found wslc: $wslc"
        Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $wslc)
        "WSLC_PATH=$wslc" | Add-Content -LiteralPath $env:GITHUB_ENV

    - name: Keep the wslc virtual machine running
      shell: pwsh
      run: |
        # wslc stops its virtual machine about 30 seconds after the last container is gone, and boots it again on the
        # next command. The tests run once per target framework, so the second run has to boot it again, and on the CI
        # agents that second boot sometimes hangs: every 'wslc' command then times out for minutes. A container that
        # runs for the whole job keeps the machine up, so it boots once, here, before the tests start.
        if (-not $env:WSLC_PATH) {
          Write-Host "wslc.exe was not found; the Wslc tests report it."
          exit 0
        }

        $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
        & $env:WSLC_PATH run -d --name meziantou-ci-wslc-keepalive busybox:1.37 sleep 86400
        $exitCode = $LASTEXITCODE
        Write-Host "Started the keep-alive container in $([int]$stopwatch.Elapsed.TotalSeconds) second(s) (exit code $exitCode)"
        if ($exitCode -ne 0) {
          # The tests still run without it and report a wslc that does not answer, so this is only a warning
          Write-Host "::warning::Could not start the wslc keep-alive container (exit code $exitCode)"
        }

        exit 0
