name: publish
on:
  workflow_dispatch:
    inputs:
      enable_code_coverage:
        description: Enable code coverage collection
        type: boolean
        default: false
        required: false
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget
  NuGetSource: "https://api.nuget.org/v3/index.json"

defaults:
  run:
    shell: pwsh

jobs:
  build_eng_scripts:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - name: Build eng scripts
        run: |
          Get-ChildItem ./eng/*.cs | ForEach-Object {
            Write-Host "Building $_"
            dotnet build $_
            if ($LASTEXITCODE -ne 0) { throw "Failed to build $_" }
          }

  validate_generated_files:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - name: Validate generated files and test project TFMs
        run: dotnet run ./eng/update-all.cs

  create_nuget:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      has-project: ${{ steps.package-project.outputs.has-project }}
    env:
      # Analyzers run in the run_analyzers job
      RunAnalyzers: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: git config --global protocol.file.allow always
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - name: Generate delta build file
        id: package-project
        uses: ./.github/actions/deltabuild
        with:
          input-project: eng/packages.proj
          output-project: eng/packages.delta.proj
          base-commit: ${{ case(github.event_name == 'push', github.event.before, '') }}
          run-generate: ${{ case(github.event_name == 'pull_request' || github.event_name == 'push', 'true', 'false') }}
          full-rebuild-triggers: |
            .github/workflows/ci.yml
            eng/**/*.proj

      - run: dotnet restore ${{ steps.package-project.outputs.project }} -p:Configuration=Release /p:IsOfficialBuild=true /bl:restore.binlog
        if: steps.package-project.outputs.has-project == 'true'
      - run: dotnet build src/Meziantou.Framework.PublicApiGenerator.Tool/Meziantou.Framework.PublicApiGenerator.Tool.csproj --configuration Release /p:IsOfficialBuild=true /bl:build.publicapi.binlog
        if: steps.package-project.outputs.has-project == 'true'
      - run: dotnet build ${{ steps.package-project.outputs.project }} --configuration Release --no-restore /p:IsOfficialBuild=true /p:PublicApiGeneratorVerifyNoChangeOnBuild=true /bl:build.binlog
        if: steps.package-project.outputs.has-project == 'true'

      - name: Prepare NuGet artifact directory
        run: |
          New-Item -ItemType Directory -Path "${{ env.NuGetDirectory }}" -Force | Out-Null
          Set-Content -Path "${{ env.NuGetDirectory }}/artifact-placeholder.txt" -Value "placeholder"
      - run: dotnet pack ${{ steps.package-project.outputs.project }} --configuration Release --no-build /p:IsOfficialBuild=true --output ${{ env.NuGetDirectory }} /p:RepositoryBranch="${{github.ref}}" "/p:PromptFolder=${{runner.temp}}/prompt" /bl:pack.binlog
        if: steps.package-project.outputs.has-project == 'true'

      - name: Skip packaging
        if: steps.package-project.outputs.has-project != 'true'
        run: Write-Host "No package project was impacted. Skipping build and pack."
      - parallel:
          - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
            if: always()
            with:
              name: nuget
              if-no-files-found: error
              retention-days: 3
              path: ${{ env.NuGetDirectory }}/**/*
          - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
            if: always()
            with:
              name: binlog
              if-no-files-found: ${{ case(steps.package-project.outputs.has-project == 'true', 'error', 'warn') }}
              retention-days: 3
              path: '**/*.binlog'

  validate_nuget:
    runs-on: ubuntu-26.04
    needs: [ create_nuget ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - parallel:
          - name: Setup .NET
            uses: ./.github/actions/setup-dotnet
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            if: needs.create_nuget.outputs.has-project == 'true'
            with:
              name: nuget
              path: ${{ env.NuGetDirectory }}
      - name: Validate NuGet packages
        if: needs.create_nuget.outputs.has-project == 'true'
        run: dotnet run ./eng/validate-nuget.cs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_VALIDATION_IS_DELTA: ${{ case((github.event_name == 'pull_request' || github.event_name == 'push') && needs.create_nuget.outputs.has-project == 'true', 'true', 'false') }}

  run_analyzers:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: git config --global protocol.file.allow always
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Generate delta build file
        id: build-project
        uses: ./.github/actions/deltabuild
        with:
          input-project: eng/build.proj
          output-project: eng/delta.proj
          base-commit: ${{ case(github.event_name == 'push', github.event.before, '') }}
          run-generate: ${{ case(github.event_name == 'pull_request' || github.event_name == 'push', 'true', 'false') }}
          full-rebuild-triggers: |
            .github/workflows/ci.yml
            eng/**/*.proj

      # Generating the public API of a project runs this tool, and a delta build does not
      # necessarily contain it
      - run: dotnet build src/Meziantou.Framework.PublicApiGenerator.Tool/Meziantou.Framework.PublicApiGenerator.Tool.csproj --configuration Release /p:IsOfficialBuild=true /bl:build.publicapi.binlog
        if: steps.build-project.outputs.has-project == 'true'

      # Analyzers are disabled when building the tests (RunAnalyzers=false) and the IDExxxx
      # diagnostics are only reported in Release with IsOfficialBuild
      - name: Build all projects
        if: steps.build-project.outputs.has-project == 'true'
        run: dotnet build ${{ steps.build-project.outputs.project }} --configuration Release /p:IsOfficialBuild=true /bl:build.binlog

      - name: Skip build
        if: steps.build-project.outputs.has-project != 'true'
        run: Write-Host "No project was impacted. Skipping build."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: binlog-analyzers
          if-no-files-found: ${{ case(steps.build-project.outputs.has-project == 'true', 'error', 'warn') }}
          retention-days: 3
          path: '**/*.binlog'

  compute_test_matrix:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.compute-matrix.outputs.matrix }}
      has-tests: ${{ steps.compute-matrix.outputs.has-tests }}
      base-commit: ${{ steps.base-commit.outputs.base-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: git config --global protocol.file.allow always
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Compute base commit
        id: base-commit
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            # Let DeltaBuild compute the merge-base with the pull request base branch
            $baseCommit = ""
          }
          elseif ($env:GITHUB_EVENT_NAME -eq "push") {
            $baseCommit = $env:BEFORE_COMMIT
          }
          else {
            # There is no base to compare with (workflow_dispatch), so use the empty tree:
            # every tracked file is reported as changed and DeltaBuild lists all test projects.
            $baseCommit = (git hash-object -t tree /dev/null).Trim()
          }

          Write-Host "Base commit: $baseCommit"
          "base-commit=$baseCommit" >> $env:GITHUB_OUTPUT

      - name: List affected test projects
        id: affected-tests
        uses: ./.github/actions/deltabuild
        with:
          input-project: eng/build.proj
          # A .json output makes DeltaBuild write the affected project paths, relative to the
          # folder containing the output file, instead of a traversal project.
          output-project: affected-test-projects.json
          base-commit: ${{ steps.base-commit.outputs.base-commit }}
          run-generate: "true"
          test-projects-only: "true"
          full-rebuild-triggers: |
            .github/workflows/ci.yml
            eng/**/*.proj

      - name: Compute test matrix
        id: compute-matrix
        run: |
          # The slowest suites are also the flakiest, so they get a job of their own
          $IsolatedProjects = @(
            "tests/Meziantou.Framework.SnapshotTesting.Tests/Meziantou.Framework.SnapshotTesting.Tests.csproj"
            "tests/Meziantou.Framework.TemporaryContainers.Tests/Meziantou.Framework.TemporaryContainers.Tests.csproj"
            "tests/Meziantou.Framework.InlineSnapshotTesting.Tests/Meziantou.Framework.InlineSnapshotTesting.Tests.csproj"
            "tests/Meziantou.Framework.PublicApiGenerator.MSBuild.Tests/Meziantou.Framework.PublicApiGenerator.MSBuild.Tests.csproj"
          )

          # The DNS suites bind sockets, so they run in their own job instead of competing with the
          # other tests of a shard
          $DnsProjects = @(
            "tests/Meziantou.Framework.DnsClient.Tests/Meziantou.Framework.DnsClient.Tests.csproj"
            "tests/Meziantou.Framework.DnsFilter.Tests/Meziantou.Framework.DnsFilter.Tests.csproj"
            "tests/Meziantou.Framework.DnsProxy.Tests/Meziantou.Framework.DnsProxy.Tests.csproj"
            "tests/Meziantou.Framework.DnsServer.Tests/Meziantou.Framework.DnsServer.Tests.csproj"
          )

          # Remaining expensive suites. They are assigned round-robin in declaration order
          # (1st -> shard 1, 2nd -> shard 2, ...), so the list is ordered from slowest to fastest
          # to spread them across shards.
          $HeavyProjects = @(
            "tests/Meziantou.Framework.StronglyTypedId.Tests/Meziantou.Framework.StronglyTypedId.Tests.csproj"
            "tests/Meziantou.Framework.EmbeddedConstantsGenerator.Tests/Meziantou.Framework.EmbeddedConstantsGenerator.Tests.csproj"
            "tests/Meziantou.Framework.CommandLineTests/Meziantou.Framework.CommandLineTests.csproj"
            "tests/Meziantou.Framework.Yaml.Tests/Meziantou.Framework.Yaml.Tests.csproj"
            "tests/Meziantou.Framework.ResxSourceGenerator.Tests/Meziantou.Framework.ResxSourceGenerator.Tests.csproj"
            "tests/Meziantou.Framework.DependencyScanning.Tests/Meziantou.Framework.DependencyScanning.Tests.csproj"
          )

          $MaxShards = 3
          $ProjectsPerShard = 15

          # Fail explicitly when a configured project is renamed or removed instead of silently
          # ignoring it and unbalancing the shards.
          foreach ($project in @($IsolatedProjects) + @($DnsProjects) + @($HeavyProjects)) {
            if (-not (Test-Path -LiteralPath $project)) {
              throw "Configured project does not exist: $project"
            }
          }

          $affected = @()
          if (Test-Path -LiteralPath "affected-test-projects.json") {
            $affected = @(
              Get-Content -Raw -LiteralPath "affected-test-projects.json"
              | ConvertFrom-Json
              | ForEach-Object { $_.Replace('\', '/') }
            )
          }

          Write-Host "Affected test projects: $($affected.Count)"

          $groups = @()
          $isolated = @($IsolatedProjects | Where-Object { $affected -contains $_ })
          foreach ($project in $isolated) {
            # tests/Meziantou.Framework.SnapshotTesting.Tests/Meziantou.Framework.SnapshotTesting.Tests.csproj -> SnapshotTesting
            $id = [System.IO.Path]::GetFileNameWithoutExtension($project) -replace '^Meziantou\.Framework\.', '' -replace '\.Tests$', ''
            $groups += [pscustomobject]@{ id = $id; projects = $project }
          }

          $dns = @($DnsProjects | Where-Object { $affected -contains $_ })
          if ($dns.Count -gt 0) {
            $groups += [pscustomobject]@{ id = "Dns"; projects = ($dns -join "`n") }
          }

          $rest = @($affected | Where-Object { $isolated -notcontains $_ -and $dns -notcontains $_ } | Sort-Object)
          if ($rest.Count -gt 0) {
            $shardCount = [int][Math]::Min($MaxShards, [Math]::Max(1, [Math]::Ceiling($rest.Count / $ProjectsPerShard)))
            $shards = @(1..$shardCount | ForEach-Object { ,[System.Collections.Generic.List[string]]::new() })

            $heavy = @($HeavyProjects | Where-Object { $rest -contains $_ })
            for ($i = 0; $i -lt $heavy.Count; $i++) {
              $shards[$i % $shardCount].Add($heavy[$i])
            }

            # Split the remaining projects into contiguous blocks of equal size
            $remaining = @($rest | Where-Object { $heavy -notcontains $_ })
            $minimumShardSize = [int][Math]::Floor($remaining.Count / $shardCount)
            $shardCountWithExtraProject = $remaining.Count % $shardCount
            $currentIndex = 0
            for ($i = 0; $i -lt $shardCount; $i++) {
              $shardSize = $minimumShardSize + $(if ($i -lt $shardCountWithExtraProject) { 1 } else { 0 })
              for ($j = 0; $j -lt $shardSize; $j++) {
                $shards[$i].Add($remaining[$currentIndex])
                $currentIndex++
              }
            }

            for ($i = 0; $i -lt $shardCount; $i++) {
              if ($shards[$i].Count -gt 0) {
                $groups += [pscustomobject]@{ id = "shard-$($i + 1)"; projects = ($shards[$i] -join "`n") }
              }
            }
          }

          foreach ($group in $groups) {
            Write-Host "Group '$($group.id)':"
            $group.projects -split "`n" | ForEach-Object { Write-Host "  $_" }
          }

          # -InputObject does not unroll the array, so the result is a JSON array for 0, 1 or more groups
          $matrix = ConvertTo-Json -InputObject @($groups) -Compress
          Write-Host "Matrix: $matrix"
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          "has-tests=$(($groups.Count -gt 0).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build_and_test:
    needs: [ compute_test_matrix ]
    if: needs.compute_test_matrix.outputs.has-tests == 'true'
    name: build_and_test (${{ matrix.runs-on }}, ${{ matrix.configuration }}${{ case(matrix.additionalArguments == '', '', ', invariant') }}, ${{ matrix.test-group.id }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    strategy:
      matrix:
        # x64, arm64
        runs-on: [ windows-2025-vs2026, ubuntu-26.04, ubuntu-26.04-arm, macos-26 ]
        configuration: [ Debug, Release ]
        additionalArguments: [ "", "/p:InvariantGlobalization=true" ]
        test-group: ${{ fromJson(needs.compute_test_matrix.outputs.matrix) }}
        exclude:
          # Debug already covers the invariant globalization mode
          - configuration: Release
            additionalArguments: "/p:InvariantGlobalization=true"
      fail-fast: false
    env:
      RUNS_ON: ${{ matrix.runs-on }}
      TestResultsDirectory: ${{ github.workspace}}/TestResults
      MEZIANTOU_PUBLIC_API_TEST_CACHE_DIRECTORY: ${{ github.workspace}}/.cache/public-api-generator-tests
      EnableCodeCoverage: ${{ case(github.event_name == 'workflow_dispatch' && inputs.enable_code_coverage, 'true', 'false') }}
      RunAnalyzers: false
    steps:
      - id: compute-artifact-name
        name: Compute artifact name
        run: |
          $SanitizedName = "${{ matrix.runs-on }}-${{ matrix.configuration }}-${{matrix.additionalArguments}}".Replace(":", "_").Replace("/", "_")
          "artifact-name=test-results-$SanitizedName-${{ matrix.test-group.id }}" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: git config --global protocol.file.allow always

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Generate delta build file
        id: build-project
        uses: ./.github/actions/deltabuild
        with:
          input-project: eng/build.proj
          output-project: eng/delta.proj
          base-commit: ${{ needs.compute_test_matrix.outputs.base-commit }}
          run-generate: "true"
          test-projects-only: "true"
          # The projects of the group are the only candidates, so the generated project contains
          # exactly the projects computed by the compute_test_matrix job.
          include: ${{ matrix.test-group.projects }}
          full-rebuild-triggers: |
            .github/workflows/ci.yml
            eng/**/*.proj

      - parallel:
          - name: Cache Public API test compilation outputs
            if: steps.build-project.outputs.has-project == 'true'
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
            with:
              path: ${{ env.MEZIANTOU_PUBLIC_API_TEST_CACHE_DIRECTORY }}
              key: public-api-test-compilation-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Meziantou.Framework.PublicApiGenerator.Tests/PublicApiGeneratorTests.cs', 'tests/Meziantou.Framework.PublicApiGenerator.Tests/Meziantou.Framework.PublicApiGenerator.Tests.csproj', 'global.json') }}
              restore-keys: |
                public-api-test-compilation-cache-${{ runner.os }}-${{ runner.arch }}-

          - name: List environment variables
            if: steps.build-project.outputs.has-project == 'true'
            run: "Get-ChildItem env: | Sort-Object Name"

          - name: .NET info
            if: steps.build-project.outputs.has-project == 'true'
            run: dotnet --info

          - name: Enable ProjFS
            if: startsWith(matrix.runs-on, 'windows') && steps.build-project.outputs.has-project == 'true'
            run: |
              $feature = Get-WindowsOptionalFeature -Online -FeatureName Client-ProjFS
              if ($feature.State -ne 'Enabled') {
                Enable-WindowsOptionalFeature -Online -FeatureName Client-ProjFS -NoRestart
              }

          # The Wslc tests fail instead of skipping on Windows agents, so this step is what keeps them running
          - name: Setup wslc
            if: startsWith(matrix.runs-on, 'windows') && matrix.test-group.id == 'TemporaryContainers' && steps.build-project.outputs.has-project == 'true'
            uses: ./.github/actions/setup-wslc

          # Apple's runtime is not preinstalled on the macOS agents, so without this step the AppleContainer tests
          # skip. The action never fails the job: whether the agents can run the runtime at all is reported by the
          # debug_apple_container job.
          - name: Setup Apple container
            if: startsWith(matrix.runs-on, 'macos') && matrix.test-group.id == 'TemporaryContainers' && steps.build-project.outputs.has-project == 'true'
            uses: ./.github/actions/setup-apple-container

      - name: Build
        if: steps.build-project.outputs.has-project == 'true'
        run: dotnet build ${{ steps.build-project.outputs.project }} --configuration ${{ matrix.configuration }} /bl ${{ matrix.additionalArguments }}

      - name: Run tests
        if: steps.build-project.outputs.has-project == 'true'
        run: dotnet test ${{ steps.build-project.outputs.project }} --configuration ${{ matrix.configuration }} --no-build --results-directory "${{ env.TestResultsDirectory }}" /p:EnableCodeCoverage=${{ env.EnableCodeCoverage }} ${{ matrix.additionalArguments }}

      - name: Cleanup test results
        if: steps.build-project.outputs.has-project == 'true'
        run: Get-ChildItem -Recurse "${{ env.TestResultsDirectory }}/" -Filter "*.dmp" | Remove-Item -Force -ErrorAction SilentlyContinue

      - parallel:
          - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
            if: always() && steps.build-project.outputs.has-project == 'true'
            with:
              name: ${{ steps.compute-artifact-name.outputs.artifact-name }}
              # A group can legitimately produce no test result when all its projects are
              # excluded on the current platform (eng/build.platform-exclusions.proj)
              if-no-files-found: warn
              retention-days: 3
              path: |
                !**/*.coverage
                **/*.binlog
                ${{ env.TestResultsDirectory }}/**/*
                **/obj/**/GeneratedFiles/**/*.cs
          - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
            if: always() && steps.build-project.outputs.has-project == 'true' && env.EnableCodeCoverage == 'true'
            with:
              name: ${{ steps.compute-artifact-name.outputs.artifact-name }}-coverage
              if-no-files-found: warn
              retention-days: 3
              path: |
                **/*.coverage

  # Debug job: reports which wslc the Windows agents provide, independently of the test run
  debug_wslc:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup wslc
        uses: ./.github/actions/setup-wslc
      - name: wslc version
        run: wslc version

  # Debug job: reports whether the macOS agents can actually run Apple's container runtime, independently of the
  # test run. Apple boots a virtual machine per container and GitHub-hosted macOS agents are themselves virtual
  # machines without nested virtualization (actions/runner-images#13565), so this is expected to report that the
  # runtime is unavailable. The job does not fail on that outcome: it exists to tell us the day it changes.
  debug_apple_container:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Apple container
        id: setup
        uses: ./.github/actions/setup-apple-container
      - name: Run a container
        if: steps.setup.outputs.available == 'true'
        run: container run --rm busybox:1.37 echo "hello from container"
      - name: Report the outcome
        run: |
          if ("${{ steps.setup.outputs.available }}" -eq "true") {
            $message = "Apple's container runtime answered on ${{ runner.os }} ${{ runner.arch }}. AppleContainerContainerTests can be made required."
          }
          else {
            $message = "Apple's container runtime did not answer on ${{ runner.os }} ${{ runner.arch }}, so AppleContainerContainerTests skips. The warnings above name the step that failed."
          }

          Write-Host $message
          $message >> $env:GITHUB_STEP_SUMMARY

  test_trimming:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      matrix:
        # https://docs.microsoft.com/en-us/dotnet/core/rid-catalog
        runtime: [ "win-x64", "linux-x64", "osx-x64" ]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - run: dotnet publish --configuration Release --runtime ${{ matrix.runtime }} --self-contained tests/Trimmable/Trimmable.csproj

  test_trimming_wpf:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    strategy:
      matrix:
        runtime: [ "win-x64" ]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - run: dotnet publish --configuration Release --runtime ${{ matrix.runtime }} --self-contained tests/Trimmable.Wpf/Trimmable.Wpf.csproj

  merge_coverage:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_code_coverage }}
    runs-on: ubuntu-26.04
    needs: [build_and_test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download test results
        id: download-test-results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        background: true
        with:
          pattern: test-results-*-coverage
          path: test-results
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install dotnet-coverage
        run: dotnet tool update --global dotnet-coverage
      # Delta builds can legitimately produce no .coverage files. In that case,
      # skip merge commands and allow the upload step to warn instead of failing.
      - name: Wait for background steps
        wait-all:
      - parallel:
          - name: Merge coverage files (format coverage)
            if: ${{ hashFiles('test-results/**/*.coverage') != '' }}
            run: dotnet-coverage merge --output test-result.coverage --output-format coverage (Get-ChildItem test-results -Recurse -Filter "*.coverage")
          - name: Merge coverage files (format cobertura)
            if: ${{ hashFiles('test-results/**/*.coverage') != '' }}
            run: dotnet-coverage merge --output test-result.cobertura.xml --output-format cobertura (Get-ChildItem test-results -Recurse -Filter "*.coverage")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage
          if-no-files-found: warn
          retention-days: 3
          path: |
            test-result.coverage
            test-result.cobertura.xml

  deploy:
    # build_and_test is skipped when no test project is affected, which must not prevent the deployment
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-26.04
    needs: [ build_eng_scripts, validate_generated_files, validate_nuget, run_analyzers, compute_test_matrix, build_and_test, test_trimming, test_trimming_wpf ]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - parallel:
          - name: Setup .NET
            uses: ./.github/actions/setup-dotnet
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with:
              name: nuget
              path: ${{ env.NuGetDirectory }}
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: meziantou

      - run: |
          Write-Host "Current ref: $env:GITHUB_REF"
          Write-Host "Searching nupkg in folder: ${{ env.NuGetDirectory }}"
          $files = Get-ChildItem "${{ env.NuGetDirectory }}/*" -Include *.nupkg
          if ($env:GITHUB_REF -eq 'refs/heads/main')
          {
            $apiKey = $env:NUGETAPIKEY
            $source = "${{ env.NuGetSource }}"
          }
          else
          {
            $apiKey = $env:FEEDZ_APIKEY
            $source = "https://f.feedz.io/meziantou/meziantou-framework/nuget/index.json"
          }

          if ($files.Count -eq 0) {
            Write-Host "No NuGet package found to push."
          }
          else {
            $maxAttempts = 3
            $baseDelaySeconds = 2
            $results = $files | ForEach-Object -Parallel {
              $packagePath = $_.FullName
              $apiKey = $using:apiKey
              $source = $using:source
              $maxAttempts = $using:maxAttempts
              $baseDelaySeconds = $using:baseDelaySeconds

              for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
                Write-Host "Pushing NuGet package: $packagePath (attempt $attempt/$maxAttempts)"
                & dotnet nuget push "$packagePath" --api-key "$apiKey" --source "$source" --force-english-output --skip-duplicate
                $exitCode = $LASTEXITCODE

                if ($exitCode -eq 0) {
                  return [pscustomobject]@{
                    PackagePath = $packagePath
                    Succeeded = $true
                    Attempts = $attempt
                  }
                }

                if ($attempt -lt $maxAttempts) {
                  $delaySeconds = [int]($baseDelaySeconds * [math]::Pow(2, $attempt - 1))
                  Write-Host "Retrying NuGet push for $packagePath in $delaySeconds second(s)."
                  Start-Sleep -Seconds $delaySeconds
                }
              }

              return [pscustomobject]@{
                PackagePath = $packagePath
                Succeeded = $false
                Attempts = $maxAttempts
              }
            } -ThrottleLimit 8

            $pushResults = @(
              $results
              | Where-Object { $_.PSObject.Properties.Name -contains "Succeeded" }
            )
            $failedPackages = @($pushResults | Where-Object { -not $_.Succeeded })
            $succeededPackages = @($pushResults | Where-Object { $_.Succeeded })
            foreach ($item in $succeededPackages) {
              Write-Host "Successfully pushed NuGet package: $($item.PackagePath) (attempts: $($item.Attempts))"
            }

            if ($failedPackages.Count -gt 0) {
              foreach ($item in $failedPackages) {
                Write-Host "::error::Failed to push NuGet package after retries: $($item.PackagePath)"
              }

              Write-Host "::error::Failed to push NuGet packages after retries: $($failedPackages.PackagePath -join ', ')"
              throw "Failed to push NuGet packages after retries: $($failedPackages.PackagePath -join ', ')"
            }
          }
        name: Publish NuGet packages
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        env:
          NUGETAPIKEY: ${{steps.login.outputs.NUGET_API_KEY}}
          FEEDZ_APIKEY: ${{ secrets.FEEDZ_APIKEY }}

  final_status_check:
    runs-on: ubuntu-slim
    if: always()
    needs: [ build_eng_scripts, validate_generated_files, create_nuget, validate_nuget, run_analyzers, compute_test_matrix, build_and_test, debug_wslc, debug_apple_container, test_trimming, test_trimming_wpf, merge_coverage, deploy ]
    steps:
      - name: Check previous jobs status
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          $needs = $env:NEEDS_JSON | ConvertFrom-Json -AsHashtable
          $failedJobs = @(
            $needs.GetEnumerator()
            | Where-Object { $_.Value.result -notin @('success', 'skipped') }
          )

          if ($failedJobs.Count -eq 0) {
            Write-Host "All dependency jobs succeeded or were skipped."
            exit 0
          }

          $failedJobNames = $failedJobs.Name | Sort-Object
          Write-Host "::error::Some jobs did not succeed: $($failedJobNames -join ', ')"
          exit 1
