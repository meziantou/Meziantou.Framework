name: Documentation

# The API pages are generated from the packages of the checked-out commit, so the site is rebuilt on every push to
# main. Pull requests only build it when the documentation or its build changes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'docgen.json'
      - 'dotnet-tools.json'
      - '.github/actions/pack/**'
      - '.github/workflows/documentation.yml'

# On main, a newer run replaces the site anyway, so an older one is cancelled instead of deploying after it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  build_documentation:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # Analyzers run in the run_analyzers job of ci.yml
      RunAnalyzers: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: $/.github/actions/setup-dotnet
      # Packs every package, as publish.yml does, in the folder docgen.json reads them from. The packages on nuget.org
      # can be behind main until the next version bump, and a page using a new member would fail. The versions keep
      # no -build-<commit> suffix on pull requests, so the pages show the versions of the project files. The generator
      # also accepts prerelease versions from a folder, for the SDKs that do not support EnableGitHubBuildVersionSuffix.
      - name: Build and pack
        uses: $/.github/actions/pack
        with:
          project: eng/packages.proj
          output: artifacts/package/release
          build-version-suffix: "false"
      - name: Restore tools
        run: dotnet tool restore
      # Generates the site in artifacts/docs. Broken links and invalid pages are errors; the warnings are about the XML
      # documentation of the packages and of their references, so they do not fail the build.
      - name: Build documentation
        run: dotnet Meziantou.DocumentationGenerator build
      - parallel:
          - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
            with:
              name: documentation
              path: artifacts/docs
              if-no-files-found: error
          - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
            if: always()
            with:
              name: binlog
              if-no-files-found: warn
              retention-days: 3
              path: '*.binlog'

  publish_documentation:
    if: github.ref == 'refs/heads/main'
    needs: build_documentation
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: documentation
          path: artifacts/docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: artifacts/docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
