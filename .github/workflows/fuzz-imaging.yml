# Weekly campaign of the Imaging fuzz tests (fuzz/Meziantou.Framework.Imaging.FuzzTests). Pull requests run them with
# a small fixed budget; this run uses a new base seed every week and a time budget per campaign. Every failure opens
# an issue (or comments on the open one with the same title) with the reproduction details.
name: fuzz-imaging
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Base seed (any 64-bit unsigned integer; default is the run id)
        type: string
        required: false
      duration_seconds:
        description: Time budget of each campaign, in seconds
        type: number
        default: 420
        required: false
  schedule:
    - cron: '0 3 * * 6' # weekly, Saturday 3:00 in Toronto (follows daylight saving time)
      timezone: America/Toronto

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_SEED: ${{ inputs.seed || github.run_id }}
  # The test host kills a test still running after 10 minutes (hang dump). 420 s leaves time to minimize the
  # failures found at the end of the budget.
  MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_DURATION_SECONDS: ${{ inputs.duration_seconds || 420 }}

defaults:
  run:
    shell: pwsh

jobs:
  fuzz:
    name: fuzz (${{ matrix.shard.id }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          # The seed groups of MutationFuzzTests are split by position (MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_SHARD), so a new
          # group is fuzzed without changing this file
          - { id: mutation-0, shard: 0/4, filter: --filter-class Meziantou.Framework.Imaging.FuzzTests.MutationFuzzTests }
          - { id: mutation-1, shard: 1/4, filter: --filter-class Meziantou.Framework.Imaging.FuzzTests.MutationFuzzTests }
          - { id: mutation-2, shard: 2/4, filter: --filter-class Meziantou.Framework.Imaging.FuzzTests.MutationFuzzTests }
          - { id: mutation-3, shard: 3/4, filter: --filter-class Meziantou.Framework.Imaging.FuzzTests.MutationFuzzTests }
          # Fonts, ICC profiles, drawing and text layout, plus the regression and harness tests
          - { id: other, shard: '', filter: --filter-not-class Meziantou.Framework.Imaging.FuzzTests.MutationFuzzTests }
    env:
      # The duration is the only bound
      MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_ITERATIONS: 2000000000
      MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_SHARD: ${{ matrix.shard.shard }}
      MEZIANTOU_FRAMEWORK_IMAGING_TEST_ARTIFACTS: ${{ github.workspace }}/FuzzArtifacts
      MEZIANTOU_FRAMEWORK_IMAGING_TEST_PREVIEWS: false
      TestResultsDirectory: ${{ github.workspace }}/TestResults
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: $/.github/actions/setup-dotnet
      - name: Write campaign summary
        run: |
          # FuzzSettings silently falls back to the default seed for a value it cannot parse
          $seed = [ulong]0
          if (-not [ulong]::TryParse($env:MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_SEED, [ref]$seed)) {
            throw "The seed '$env:MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_SEED' is not a 64-bit unsigned integer"
          }

          "Base seed ``$env:MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_SEED``, $env:MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_DURATION_SECONDS s per campaign, shard ``${{ matrix.shard.id }}``, commit ``$env:GITHUB_SHA``" >> $env:GITHUB_STEP_SUMMARY
      - name: Build
        run: dotnet build fuzz/Meziantou.Framework.Imaging.FuzzTests --configuration Release
      - name: Run fuzz tests
        # An absolute path: dotnet test resolves a relative project path twice
        run: dotnet test --project "${{ github.workspace }}/fuzz/Meziantou.Framework.Imaging.FuzzTests" --configuration Release --no-build --results-directory "${{ env.TestResultsDirectory }}" ${{ matrix.shard.filter }}
      - name: Cleanup test results
        if: always()
        run: Get-ChildItem -Recurse "${{ env.TestResultsDirectory }}/" -Filter "*.dmp" | Remove-Item -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: fuzz-${{ matrix.shard.id }}
          if-no-files-found: warn
          # Linked from the issues: the minimized inputs stay available until the failure is investigated
          retention-days: 30
          path: |
            ${{ env.TestResultsDirectory }}/*.trx
            FuzzArtifacts/**/*

  report:
    needs: [ fuzz ]
    if: always() && github.repository == 'meziantou/Meziantou.Framework'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download fuzz results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: fuzz-*
          path: fuzz-results
      - name: Open or update issues
        run: ./eng/report-fuzz-failures.ps1 -ResultsDirectory fuzz-results -Labels fuzzing, component:imaging
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FUZZ_JOB_RESULT: ${{ needs.fuzz.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
