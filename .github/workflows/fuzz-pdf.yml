# Weekly campaign of the Pdf fuzz tests (fuzz/Meziantou.Framework.Pdf.FuzzTests, see fuzz/README.md), on x64 and on
# arm64. Pull requests run them with a small fixed budget; eng/run-fuzz-tests.ps1 runs them with a new base seed every
# week and a larger number of mutated inputs per seed. It writes a result.json and a failure.md file per failed test, so
# the report job opens an issue for every failing test (or comments on the open one with the same title) with the
# failure and the commands that reproduce it. The campaign runs on the night with the fewest campaigns (see
# FUZZ_PROJECTS in fuzz-sharpfuzz.yml).
name: fuzz-pdf
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Base seed of the Pdf fuzz tests (any 64-bit unsigned integer; default is the run id)
        type: string
        required: false
      iterations:
        description: Mutated inputs per seed of the Pdf fuzz tests
        type: number
        default: 50000
        required: false
  schedule:
    - cron: '0 3 * * 5' # weekly, Friday 3:00 in Toronto (follows daylight saving time)
      timezone: America/Toronto

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  fuzz:
    name: fuzz (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Both architectures fuzz the same cases (same base seed)
        platform:
          - { runner: ubuntu-26.04, arch: x64 }
          - { runner: ubuntu-26.04-arm, arch: arm64 }
    env:
      MEZIANTOU_FRAMEWORK_PDF_FUZZ_SEED: ${{ inputs.seed || github.run_id }}
      # The test host kills a test still running after 10 minutes (hang dump): 50000 inputs per seed take a few minutes
      # for the slowest test
      MEZIANTOU_FRAMEWORK_PDF_FUZZ_ITERATIONS: ${{ inputs.iterations || 50000 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: $/.github/actions/setup-dotnet
      - name: Fuzz
        run: ./eng/run-fuzz-tests.ps1 -Project fuzz/Meziantou.Framework.Pdf.FuzzTests -SettingsPrefix MEZIANTOU_FRAMEWORK_PDF_FUZZ -ArtifactsVariable ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: fuzz-results-Meziantou.Framework.Pdf.FuzzTests-${{ matrix.platform.arch }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/fuzz/results/**
            artifacts/fuzz/test-results/**/*.trx

  report:
    needs: [ fuzz ]
    if: always() && github.repository == 'meziantou/Meziantou.Framework'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download fuzz results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # A pattern: one artifact per architecture, and a job that failed before uploading its results leaves none
          pattern: fuzz-results-Meziantou.Framework.Pdf.FuzzTests*
          path: fuzz-results
      - name: Open or update issues
        run: ./eng/report-fuzz-failures.ps1 -Project Meziantou.Framework.Pdf.FuzzTests -ResultsDirectory fuzz-results -Labels fuzzing, component:pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FUZZ_JOB_RESULT: ${{ needs.fuzz.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
