# Weekly coverage-guided fuzzing of the SharpFuzz projects (fuzz/*.Fuzz, see fuzz/README.md). Each project runs in its
# own job: eng/run-fuzz.ps1 instruments the libraries with sharpfuzz and runs libFuzzer on every target. The corpus each
# target reaches is cached, so every campaign starts where the previous one stopped. Every failing target opens an issue
# (or comments on the open one with the same title) with the failing input and the commands that reproduce it.
name: fuzz
on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Time budget of each target, in seconds
        type: number
        default: 300
        required: false
  schedule:
    - cron: '0 4 * * 6' # weekly, Saturday 4:00 in Toronto (follows daylight saving time)
      timezone: America/Toronto

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  FUZZ_DURATION_SECONDS: ${{ inputs.duration_seconds || 300 }}
  SHARPFUZZ_VERSION: 2.3.0
  # libFuzzer driver for SharpFuzz (https://github.com/Metalnem/libfuzzer-dotnet)
  LIBFUZZER_DOTNET_URL: https://github.com/Metalnem/libfuzzer-dotnet/releases/download/v2025.05.02.0904/libfuzzer-dotnet-ubuntu
  LIBFUZZER_DOTNET_SHA256: c2c2a90d94c409a4af339a0d4f244e0442c5a5d249be0f1252ba07871f285958

defaults:
  run:
    shell: pwsh

jobs:
  fuzz:
    name: fuzz (${{ matrix.project }})
    # x64: on arm64, the trap that reports a failure to libFuzzer raises a signal libFuzzer does not handle
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Every fuzz/*.Fuzz project (Meziantou.Framework.Fuzzing.Tests checks that none is missing)
        project:
          - Meziantou.Framework.DependencyScanning.Fuzz
          - Meziantou.Framework.Globbing.Fuzz
          - Meziantou.Framework.HtmlSanitizer.Fuzz
          - Meziantou.Framework.JsonPath.Fuzz
          - Meziantou.Framework.Language.Fuzz
          - Meziantou.Framework.SyntaxHighlighting.Fuzz
          - Meziantou.Framework.TdsServer.Fuzz
          - Meziantou.Framework.Toml.Fuzz
          - Meziantou.Framework.Unicode.Fuzz
          - Meziantou.Framework.Yaml.Fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: $/.github/actions/setup-dotnet
      - name: Install SharpFuzz and libfuzzer-dotnet
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'fuzz-tools'
          dotnet tool install SharpFuzz.CommandLine --version $env:SHARPFUZZ_VERSION --tool-path $tools
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install failed with exit code $LASTEXITCODE" }

          $libFuzzer = Join-Path $tools 'libfuzzer-dotnet'
          Invoke-WebRequest -Uri $env:LIBFUZZER_DOTNET_URL -OutFile $libFuzzer
          $hash = (Get-FileHash -Algorithm SHA256 $libFuzzer).Hash
          if ($hash -ne $env:LIBFUZZER_DOTNET_SHA256) { throw "Unexpected SHA-256 of libfuzzer-dotnet: $hash" }
          chmod +x $libFuzzer
          "FUZZ_TOOLS=$tools" >> $env:GITHUB_ENV
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/fuzz-corpus
          key: fuzz-corpus-${{ matrix.project }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.project }}-
      - name: Fuzz
        run: |
          "Commit ``$env:GITHUB_SHA``, $env:FUZZ_DURATION_SECONDS s per target" >> $env:GITHUB_STEP_SUMMARY
          ./eng/run-fuzz.ps1 -Project fuzz/${{ matrix.project }} -DurationSeconds $env:FUZZ_DURATION_SECONDS -LibFuzzer "$env:FUZZ_TOOLS/libfuzzer-dotnet" -SharpFuzz "$env:FUZZ_TOOLS/sharpfuzz"
      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/fuzz-corpus
          key: fuzz-corpus-${{ matrix.project }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: fuzz-results-${{ matrix.project }}
          if-no-files-found: warn
          # Linked from the issues: the failing inputs stay available until the failure is investigated
          retention-days: 30
          path: |
            artifacts/fuzz/results/**
            !artifacts/fuzz/results/*/seeds/**
            !artifacts/fuzz/results/*/merged-corpus/**

  report:
    needs: [ fuzz ]
    if: always() && github.repository == 'meziantou/Meziantou.Framework'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download fuzz results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: fuzz-results-*
          path: fuzz-results
      - name: Open or update issues
        run: ./eng/report-fuzz-crashes.ps1 -ResultsDirectory fuzz-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FUZZ_JOB_RESULT: ${{ needs.fuzz.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
