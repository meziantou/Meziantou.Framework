# Weekly fuzzing campaign (see fuzz/README.md):
# - fuzz: coverage-guided fuzzing of the SharpFuzz projects (fuzz/*.Fuzz). Each project runs in its own job:
#   eng/run-fuzz.ps1 instruments the libraries with sharpfuzz and runs libFuzzer on every target. The corpus each target
#   reaches is cached, so every campaign starts where the previous one stopped.
# - fuzz-imaging: the Imaging fuzz tests (fuzz/Meziantou.Framework.Imaging.FuzzTests), split across jobs. Pull requests
#   run them with a small fixed budget; eng/run-imaging-fuzz.ps1 runs them with a new base seed every week and a time
#   budget per campaign.
# Both write a result.json and a failure.md file per target, so the report job opens an issue for every failing target
# (or comments on the open one with the same title) with the failing input and the commands that reproduce it.
name: fuzz
on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Time budget of each SharpFuzz target, in seconds
        type: number
        default: 300
        required: false
      imaging_seed:
        description: Base seed of the Imaging fuzz tests (any 64-bit unsigned integer; default is the run id)
        type: string
        required: false
      imaging_duration_seconds:
        description: Time budget of each Imaging fuzz test campaign, in seconds
        type: number
        default: 420
        required: false
  schedule:
    - cron: '0 3 * * 6' # weekly, Saturday 3:00 in Toronto (follows daylight saving time)
      timezone: America/Toronto

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  FUZZ_DURATION_SECONDS: ${{ inputs.duration_seconds || 300 }}
  SHARPFUZZ_VERSION: 2.3.0
  # libFuzzer driver for SharpFuzz (https://github.com/Metalnem/libfuzzer-dotnet)
  LIBFUZZER_DOTNET_URL: https://github.com/Metalnem/libfuzzer-dotnet/releases/download/v2025.05.02.0904/libfuzzer-dotnet-ubuntu
  LIBFUZZER_DOTNET_SHA256: c2c2a90d94c409a4af339a0d4f244e0442c5a5d249be0f1252ba07871f285958

defaults:
  run:
    shell: pwsh

jobs:
  fuzz:
    name: fuzz (${{ matrix.project }})
    # x64: on arm64, the trap that reports a failure to libFuzzer raises a signal libFuzzer does not handle
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Every fuzz/*.Fuzz project and the component label of its issues (Meziantou.Framework.Fuzzing.Tests checks that
        # none is missing, here and in the report job)
        include:
          - { project: Meziantou.Framework.DependencyScanning.Fuzz, component: dependency-scanning }
          - { project: Meziantou.Framework.Globbing.Fuzz, component: globbing }
          - { project: Meziantou.Framework.HtmlSanitizer.Fuzz, component: html-sanitizer }
          - { project: Meziantou.Framework.JsonPath.Fuzz, component: jsonpath }
          - { project: Meziantou.Framework.Language.Fuzz, component: language }
          - { project: Meziantou.Framework.Markdown.Fuzz, component: markdown }
          - { project: Meziantou.Framework.MediaTags.Fuzz, component: media-tags }
          - { project: Meziantou.Framework.SyntaxHighlighting.Fuzz, component: syntax-highlighting }
          - { project: Meziantou.Framework.TdsServer.Fuzz, component: tds-server }
          - { project: Meziantou.Framework.Toml.Fuzz, component: toml }
          - { project: Meziantou.Framework.Unicode.Fuzz, component: unicode }
          - { project: Meziantou.Framework.Yaml.Fuzz, component: yaml }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: $/.github/actions/setup-dotnet
      - name: Install SharpFuzz and libfuzzer-dotnet
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'fuzz-tools'
          dotnet tool install SharpFuzz.CommandLine --version $env:SHARPFUZZ_VERSION --tool-path $tools
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool install failed with exit code $LASTEXITCODE" }

          $libFuzzer = Join-Path $tools 'libfuzzer-dotnet'
          Invoke-WebRequest -Uri $env:LIBFUZZER_DOTNET_URL -OutFile $libFuzzer
          $hash = (Get-FileHash -Algorithm SHA256 $libFuzzer).Hash
          if ($hash -ne $env:LIBFUZZER_DOTNET_SHA256) { throw "Unexpected SHA-256 of libfuzzer-dotnet: $hash" }
          chmod +x $libFuzzer
          "FUZZ_TOOLS=$tools" >> $env:GITHUB_ENV
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/fuzz-corpus
          key: fuzz-corpus-${{ matrix.project }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.project }}-
      - name: Fuzz
        run: |
          "Commit ``$env:GITHUB_SHA``, $env:FUZZ_DURATION_SECONDS s per target" >> $env:GITHUB_STEP_SUMMARY
          ./eng/run-fuzz.ps1 -Project fuzz/${{ matrix.project }} -DurationSeconds $env:FUZZ_DURATION_SECONDS -LibFuzzer "$env:FUZZ_TOOLS/libfuzzer-dotnet" -SharpFuzz "$env:FUZZ_TOOLS/sharpfuzz"
      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: artifacts/fuzz-corpus
          key: fuzz-corpus-${{ matrix.project }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: fuzz-results-${{ matrix.project }}
          if-no-files-found: warn
          # Linked from the issues: the failing inputs stay available until the failure is investigated
          retention-days: 30
          path: |
            artifacts/fuzz/results/**
            !artifacts/fuzz/results/*/seeds/**
            !artifacts/fuzz/results/*/merged-corpus/**

  fuzz-imaging:
    name: fuzz (Meziantou.Framework.Imaging.FuzzTests, ${{ matrix.shard.id }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          # The seed groups of MutationFuzzTests are split by position (MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_SHARD), so a new
          # group is fuzzed without changing this file
          - { id: mutation-0, shard: 0/4, filter: --filter-class Meziantou.Framework.Imaging.FuzzTests.MutationFuzzTests }
          - { id: mutation-1, shard: 1/4, filter: --filter-class Meziantou.Framework.Imaging.FuzzTests.MutationFuzzTests }
          - { id: mutation-2, shard: 2/4, filter: --filter-class Meziantou.Framework.Imaging.FuzzTests.MutationFuzzTests }
          - { id: mutation-3, shard: 3/4, filter: --filter-class Meziantou.Framework.Imaging.FuzzTests.MutationFuzzTests }
          # Fonts, ICC profiles, drawing and text layout, plus the regression and harness tests
          - { id: other, shard: '', filter: --filter-not-class Meziantou.Framework.Imaging.FuzzTests.MutationFuzzTests }
    env:
      MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_SEED: ${{ inputs.imaging_seed || github.run_id }}
      # The test host kills a test still running after 10 minutes (hang dump). 420 s leaves time to minimize the
      # failures found at the end of the budget.
      MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_DURATION_SECONDS: ${{ inputs.imaging_duration_seconds || 420 }}
      # The duration is the only bound
      MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_ITERATIONS: 2000000000
      MEZIANTOU_FRAMEWORK_IMAGING_FUZZ_SHARD: ${{ matrix.shard.shard }}
      MEZIANTOU_FRAMEWORK_IMAGING_TEST_PREVIEWS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: $/.github/actions/setup-dotnet
      - name: Fuzz
        run: ./eng/run-imaging-fuzz.ps1 -Shard ${{ matrix.shard.id }} -Filter '${{ matrix.shard.filter }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: fuzz-results-Meziantou.Framework.Imaging.FuzzTests-${{ matrix.shard.id }}
          if-no-files-found: warn
          # Linked from the issues: the minimized inputs stay available until the failure is investigated
          retention-days: 30
          path: |
            artifacts/fuzz/results/**
            artifacts/fuzz/inputs/**
            artifacts/fuzz/test-results/**/*.trx

  # One job per project, so that the issues of each project get the label of its component
  report:
    name: report (${{ matrix.project }})
    needs: [ fuzz, fuzz-imaging ]
    if: always() && github.repository == 'meziantou/Meziantou.Framework'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: Meziantou.Framework.DependencyScanning.Fuzz, component: dependency-scanning }
          - { project: Meziantou.Framework.Globbing.Fuzz, component: globbing }
          - { project: Meziantou.Framework.HtmlSanitizer.Fuzz, component: html-sanitizer }
          - { project: Meziantou.Framework.JsonPath.Fuzz, component: jsonpath }
          - { project: Meziantou.Framework.Language.Fuzz, component: language }
          - { project: Meziantou.Framework.Markdown.Fuzz, component: markdown }
          - { project: Meziantou.Framework.MediaTags.Fuzz, component: media-tags }
          - { project: Meziantou.Framework.SyntaxHighlighting.Fuzz, component: syntax-highlighting }
          - { project: Meziantou.Framework.TdsServer.Fuzz, component: tds-server }
          - { project: Meziantou.Framework.Toml.Fuzz, component: toml }
          - { project: Meziantou.Framework.Unicode.Fuzz, component: unicode }
          - { project: Meziantou.Framework.Yaml.Fuzz, component: yaml }
          - { project: Meziantou.Framework.Imaging.FuzzTests, component: imaging }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download fuzz results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          # A pattern: a job that failed before uploading its results leaves no artifact, and the Imaging fuzz tests
          # upload one artifact per shard
          pattern: fuzz-results-${{ matrix.project }}*
          path: fuzz-results
      - name: Open or update issues
        run: ./eng/report-fuzz-failures.ps1 -Project ${{ matrix.project }} -ResultsDirectory fuzz-results -Labels fuzzing, component:${{ matrix.component }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FUZZ_JOB_RESULT: ${{ matrix.project == 'Meziantou.Framework.Imaging.FuzzTests' && needs.fuzz-imaging.result || needs.fuzz.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
