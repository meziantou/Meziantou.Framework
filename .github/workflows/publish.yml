# Builds and validates the NuGet packages on pull requests, and publishes them on main.
name: publish
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'

concurrency:
  # A run on main gets a group of its own: it only packs the packages changed since the previous
  # push, so a cancelled or replaced run would never publish them.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget
  NuGetSource: "https://api.nuget.org/v3/index.json"

defaults:
  run:
    shell: pwsh

jobs:
  create_nuget:
    runs-on: ubuntu-26.04
    # The map packages need their layers, built in about two minutes, and are about 250 packages
    timeout-minutes: 40
    outputs:
      has-project: ${{ steps.package-project.outputs.has-project }}
    env:
      # Analyzers run in the run_analyzers job of ci.yml
      RunAnalyzers: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: $/.github/actions/setup-dotnet
      - name: Generate delta build file
        id: package-project
        uses: $/.github/actions/deltabuild
        with:
          input-project: eng/packages.proj
          output-project: eng/packages.delta.proj
          base-commit: ${{ case(github.event_name == 'push', github.event.before, github.event.pull_request.base.sha) }}
          # A manual run packs every package, so it can recover from a partial publish
          run-generate: ${{ case(github.event_name == 'pull_request' || github.event_name == 'push', 'true', 'false') }}
          full-rebuild-triggers: |
            .github/workflows/publish.yml
            .github/actions/pack/**
            .github/actions/nuget-push/**
            .github/actions/geo-maps-data/**
            eng/**/*.proj

      # The map packages of src/Meziantou.Framework.Geo.Maps.Data embed layers that are not committed: they are built
      # when one of them is packed, and the pack checks their hashes. A full pack (a manual run) packs them all
      - name: Check whether map packages are packed
        id: map-data
        if: steps.package-project.outputs.has-project == 'true'
        env:
          PROJECT: ${{ steps.package-project.outputs.project }}
        run: |
          $content = Get-Content $env:PROJECT -Raw
          $needed = $env:PROJECT -like "*eng/packages.proj" -or $content -match "Meziantou\.Framework\.Geo\.Maps\.Data\."
          Write-Host "Build the layers of the maps: $needed"
          "needed=$($needed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Build the data of the map packages
        if: steps.map-data.outputs.needed == 'true'
        uses: $/.github/actions/geo-maps-data

      - name: Prepare NuGet artifact directory
        run: |
          New-Item -ItemType Directory -Path $env:NuGetDirectory -Force | Out-Null
          Set-Content -Path (Join-Path $env:NuGetDirectory "artifact-placeholder.txt") -Value "placeholder"

      # Shared with documentation.yml, which packs every package to document them
      - name: Build and pack
        if: steps.package-project.outputs.has-project == 'true'
        uses: $/.github/actions/pack
        with:
          project: ${{ steps.package-project.outputs.project }}
          output: ${{ env.NuGetDirectory }}

      - name: Skip packaging
        if: steps.package-project.outputs.has-project != 'true'
        run: Write-Host "No package project was impacted. Skipping build and pack."
      - parallel:
          - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
            if: always()
            with:
              name: nuget
              if-no-files-found: error
              retention-days: 3
              path: ${{ env.NuGetDirectory }}/**/*
          - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
            if: always()
            with:
              name: binlog
              if-no-files-found: ${{ case(steps.package-project.outputs.has-project == 'true', 'error', 'warn') }}
              retention-days: 3
              path: '**/*.binlog'

  validate_nuget:
    runs-on: ubuntu-26.04
    needs: [ create_nuget ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - parallel:
          - name: Setup .NET
            uses: $/.github/actions/setup-dotnet
          - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
            if: needs.create_nuget.outputs.has-project == 'true'
            with:
              name: nuget
              path: ${{ env.NuGetDirectory }}
      - name: Validate NuGet packages
        if: needs.create_nuget.outputs.has-project == 'true'
        run: dotnet run ./eng/validate-nuget.cs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_VALIDATION_IS_DELTA: ${{ case((github.event_name == 'pull_request' || github.event_name == 'push') && needs.create_nuget.outputs.has-project == 'true', 'true', 'false') }}

  deploy:
    # Pull requests only build and validate the packages. A manual run from another branch must not
    # publish to nuget.org either.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.create_nuget.outputs.has-project == 'true'
    runs-on: ubuntu-26.04
    needs: [ create_nuget, validate_nuget ]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - parallel:
          - name: Setup .NET
            uses: $/.github/actions/setup-dotnet
          - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
            with:
              name: nuget
              path: ${{ env.NuGetDirectory }}
      - name: Publish NuGet packages
        uses: $/.github/actions/nuget-push
        with:
          directory: ${{ env.NuGetDirectory }}
          source: ${{ env.NuGetSource }}
