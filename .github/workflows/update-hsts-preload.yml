on:
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * 0' # once a week
  push:
    branches:
      - main
    paths:
      - 'tools/Meziantou.Framework.Http.Hsts.Generator/**'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  update_file:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - run: |
          # Built first and run with --no-build: `dotnet run` exits 1 for a build or restore failure, which is
          # also how the generator reports "files updated", so a broken build would otherwise be committed as
          # an empty update.
          dotnet build tools/Meziantou.Framework.Http.Hsts.Generator --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "The HSTS preload generator failed to build (exit code $LASTEXITCODE)"
          }

          dotnet run --project tools/Meziantou.Framework.Http.Hsts.Generator --configuration Release --no-build
          # The generator reports its result through the exit code: 0 when the files were already up to
          # date, 1 when it updated them. Any other code is a failure and must not be committed.
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) {
            throw "The HSTS preload generator failed with exit code $LASTEXITCODE"
          }
          if ($LASTEXITCODE -eq 1) {
            git config --global user.email "git@meziantou.net"
            git config --global user.name "meziantou"
            git checkout -b update-hsts-preload
            # Staged explicitly: `git add .` would also pick up anything else the build left in the tree
            git add `
              src/Meziantou.Framework.Http.Hsts/preload_*.bin `
              src/Meziantou.Framework.Http.Hsts/preload-hosts.txt `
              src/Meziantou.Framework.Http.Hsts/HstsPreloadList.g.cs `
              src/Meziantou.Framework.Http.Hsts/Meziantou.Framework.Http.Hsts.csproj
            # An unchanged tree must never reach the force-push below: it would reset the shared branch and
            # wipe the diff of a pull request that is already open, while the step still reported success.
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              throw "The generator reported an update but nothing changed in the tracked files"
            }
            git commit -m "Update HSTS preload list"
            git push origin update-hsts-preload --force
            $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            # No backticks in the string: pwsh treats them as escape characters inside double quotes
            $body = "Update HSTS preload list`n`nReview the host names added and removed in preload-hosts.txt; the preload_N.bin resources hold the same data in the form the library reads.`n`nCreated by: $runUrl"
            $openPr = gh pr list --head update-hsts-preload --state open --json number --jq '.[0].number // empty'
            if ($openPr) {
              gh pr edit $openPr --title "Update HSTS preload list" --body $body
            } else {
              gh pr create --title "Update HSTS preload list" --body $body --base main --head update-hsts-preload
            }
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
