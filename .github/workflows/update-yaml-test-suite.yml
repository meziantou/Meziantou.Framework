on:
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * 0' # once a week
  push:
    branches:
      - main
    paths:
      - 'tools/Meziantou.Framework.Yaml.TestSuite.Generator/**'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

defaults:
  run:
    shell: pwsh

jobs:
  update_file:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET
        uses: $/.github/actions/setup-dotnet
      - run: |
          # Built first and run with --no-build: `dotnet run` exits 1 for a build or restore failure, which is
          # also how the generator reports "files updated", so a broken build would otherwise be committed as
          # an empty update.
          dotnet build tools/Meziantou.Framework.Yaml.TestSuite.Generator -mt --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "The yaml-test-suite generator failed to build (exit code $LASTEXITCODE)"
          }

          dotnet run --project tools/Meziantou.Framework.Yaml.TestSuite.Generator --configuration Release --no-build
          # The generator reports its result through the exit code: 0 when the files were already up to
          # date, 1 when it updated them. Any other code is a failure and must not be committed.
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) {
            throw "The yaml-test-suite generator failed with exit code $LASTEXITCODE"
          }
          if ($LASTEXITCODE -eq 1) {
            $branch = "update-yaml-test-suite"
            $title = "Update the yaml-test-suite cases"

            # Pull requests created with GITHUB_TOKEN run no workflow, so this is the only test run the new
            # cases get before they are merged. A new case often exercises a part of the YAML specification the
            # library does not handle yet: the pull request is still opened, as a draft, so that the change is not lost.
            dotnet test --project "$PWD/tests/Meziantou.Framework.Yaml.Tests/Meziantou.Framework.Yaml.Tests.csproj" -mt --configuration Release
            $testsPassed = $LASTEXITCODE -eq 0

            # The cases are also the seeds of the YAML fuzz targets, with emitter options the unit tests do not use.
            # Replay the seeds and the regressions of every target, as Meziantou.Framework.Fuzzing.Tests does in CI.
            $fuzzProject = "fuzz/Meziantou.Framework.Yaml.Fuzz"
            $fuzzFramework = "net10.0"
            dotnet build $fuzzProject -mt --configuration Release --framework $fuzzFramework
            if ($LASTEXITCODE -ne 0) {
              $testsPassed = $false
            } else {
              $fuzzTargets = dotnet run --project $fuzzProject --configuration Release --framework $fuzzFramework --no-build -- --list
              if ($LASTEXITCODE -ne 0 -or -not $fuzzTargets) {
                $testsPassed = $false
              }
              foreach ($fuzzTarget in $fuzzTargets) {
                $seeds = Join-Path $env:RUNNER_TEMP "yaml-fuzz-seeds/$fuzzTarget"
                dotnet run --project $fuzzProject --configuration Release --framework $fuzzFramework --no-build -- $fuzzTarget --seeds $seeds
                if ($LASTEXITCODE -ne 0) {
                  $testsPassed = $false
                  continue
                }

                $inputs = @($seeds)
                $regressions = "$fuzzProject/Regressions/$fuzzTarget"
                if (Test-Path $regressions) {
                  $inputs += $regressions
                }

                dotnet run --project $fuzzProject --configuration Release --framework $fuzzFramework --no-build -- $fuzzTarget @inputs
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "::error::The fuzz target $fuzzTarget fails on its seeds or regressions"
                  $testsPassed = $false
                }
              }
            }

            git config --global user.email "git@meziantou.net"
            git config --global user.name "meziantou"
            git checkout -b $branch
            git add .
            # An unchanged tree must never reach the force-push below: it would reset the shared branch and
            # wipe the diff of a pull request that is already open, while the step still reported success.
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              throw "The generator reported an update but nothing changed in the tracked files"
            }
            git commit -m $title
            git push origin $branch --force
            $runUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if ($testsPassed) {
              $body = "$title`n`nThe Meziantou.Framework.Yaml tests and the seeds of the YAML fuzz targets pass with the new cases.`n`nCreated by: $runUrl"
            } else {
              $body = "$title`n`n**The Meziantou.Framework.Yaml tests or the seeds of the YAML fuzz targets fail with the new cases**: the parser, the emitter or the loader needs an update before this can be merged. See the test output of the run.`n`nCreated by: $runUrl"
            }

            # The branch is reused every week, so update the pull request when one is already open
            $openPr = gh pr list --head $branch --state open --json number --jq '.[0].number // empty'
            if ($openPr) {
              gh pr edit $openPr --title $title --body $body
              if ($testsPassed) {
                gh pr ready $openPr
              } else {
                gh pr ready $openPr --undo
              }
            } elseif ($testsPassed) {
              gh pr create --title $title --body $body --base main --head $branch
            } else {
              gh pr create --title $title --body $body --base main --head $branch --draft
            }
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
