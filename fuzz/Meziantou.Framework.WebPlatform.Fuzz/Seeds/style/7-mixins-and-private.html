<!DOCTYPE html><style>@mixin --m(--c, --d: var(--p)) { @private { --s: var(--c); } color: var(--s); background-color: var(--d); &.a { @contents { width: var(--s); } } .b { @apply --n; } @media (width > 0px) { @private { --s: green; } } } @mixin --n { @private { --s: 2px; } @contents; margin: var(--s); } #a { @private { --p: blue; } @apply --m(red); } .b { @apply --n { padding: var(--s, 1px); @private { --t: 3px; } } } div { @private { --x: 1em; } & > p { width: var(--x, 2em); } --x: 3em; }</style><div id=a class=a><p class=b>x</p><span>y</span></div><div class=b></div>
