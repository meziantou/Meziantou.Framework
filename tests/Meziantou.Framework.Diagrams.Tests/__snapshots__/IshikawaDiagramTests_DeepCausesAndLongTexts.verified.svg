<text x="38.14" y="20.38" text-anchor="middle" font-size="14" font-weight="bold" fill="#cccccc">late</text>
<text x="38.14" y="37.18" text-anchor="middle" font-size="14" font-weight="bold" fill="#cccccc">to</text>
<text x="38.14" y="53.98" text-anchor="middle" font-size="14" font-weight="bold" fill="#cccccc">the</text>
<text x="38.14" y="70.78" text-anchor="middle" font-size="14" font-weight="bold" fill="#cccccc">customer</text>
