<!DOCTYPE html>
<title>Transparent body</title>
<style>
  body { margin: 32px; background: rgba(0, 128, 255, .25) }
  .card { width: 300px; padding: 16px; margin-bottom: 16px; background: rgba(255, 255, 255, .6); border: 2px solid rgba(0, 0, 0, .3); border-radius: 12px }
  .layer { opacity: .5; width: 200px; height: 80px; background: #c00 }
  .hole { width: 200px; height: 80px; border: 10px solid #090 }
</style>
<div class="card">A semi-transparent card on a semi-transparent body</div>
<div class="layer"></div>
<div class="hole"></div>
